spring.application.name=flightbooking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/flyaway}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT (HS256 needs a secret of at least 32 characters)
jwt.secret=${JWT_SECRET:fly-away-travel-dev-secret-change-me-please-32+}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Folder where flight_booking_email_${booking_id}.txt files are written (default: project root)
booking.email.output-dir=${BOOKING_EMAIL_DIR:.}
